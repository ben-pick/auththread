name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      # pnpm check includes `turbo run test`, so every package suite runs in
      # one workspace-wide step. A per-package matrix only paid for extra
      # installs: each suite takes milliseconds.
      - run: pnpm check

  journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: node scripts/demo.ts > journey.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: journey
          path: journey.jsonl
