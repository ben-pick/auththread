name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      # pnpm check includes `turbo run test`, so every package suite runs in
      # one workspace-wide step. A per-package matrix only paid for extra
      # installs: each suite takes milliseconds.
      - run: pnpm check

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:check
      - run: pnpm template:check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t auththread:ci .
      - name: Smoke the image
        run: |
          docker run -d --name auththread-ci -p 8787:8787 \
            -e AUTHTHREAD_CONFIG='{"tenants":[{"tenant":"demo","provider":"oidc","apiKey":"at_test","salt":"salt-salt"}]}' \
            auththread:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz; then exit 0; fi
            sleep 1
          done
          docker logs auththread-ci
          exit 1
      - name: Stop the container
        if: always()
        run: docker stop auththread-ci || true

  journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: node scripts/demo.ts > journey.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: journey
          path: journey.jsonl

  # Builds the package graph and its diff against the PR base. It only uploads
  # markdown: the comment job has a write token and never checks out PR code.
  dep-graph:
    name: dep-graph
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - name: Build dependency graph
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pnpm graph --base "origin/${BASE_REF}" --format markdown > dep-graph.md
          cat dep-graph.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dep-graph
          path: dep-graph.md

  dep-graph-comment:
    name: dep-graph-comment
    needs: dep-graph
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dep-graph
          path: dep-graph
      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          file=dep-graph/dep-graph.md
          marker='<!-- auththread-dep-graph -->'
          chars=$(LC_ALL=C.UTF-8 wc -m < "$file")
          if [ "$chars" -gt 62000 ] || [ "$(sed -n 1p "$file")" != "$marker" ]; then
            echo "::error::dependency graph report has an unexpected shape; not posting"
            exit 1
          fi
          id=$(gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${id}" -F body=@"$file" > /dev/null
            echo "Updated comment ${id}"
          else
            gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -F body=@"$file" > /dev/null
            echo "Posted a new comment"
          fi

  # Measures the same bundles as `pnpm budget` in the check job, but against
  # the PR base. It uploads markdown only: the comment job has a write token
  # and never checks out PR code.
  bundle:
    name: bundle
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - name: Measure bundles
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pnpm budget --base "origin/${BASE_REF}" --format markdown > bundle.md
          cat bundle.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle.md

  bundle-comment:
    name: bundle-comment
    needs: bundle
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle
      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          file=bundle/bundle.md
          marker='<!-- auththread-bundle -->'
          chars=$(LC_ALL=C.UTF-8 wc -m < "$file")
          if [ "$chars" -gt 62000 ] || [ "$(sed -n 1p "$file")" != "$marker" ]; then
            echo "::error::bundle report has an unexpected shape; not posting"
            exit 1
          fi
          id=$(gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${id}" -F body=@"$file" > /dev/null
            echo "Updated comment ${id}"
          else
            gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -F body=@"$file" > /dev/null
            echo "Posted a new comment"
          fi
