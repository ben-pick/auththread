name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The first publish uses a granular token. Once the packages exist,
      # configure trusted publishing and leave NPM_TOKEN unset.
      - name: Configure npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
          fi
      # Opens or updates the version PR. Merging it publishes every public
      # package in the fixed train with npm provenance.
      # v2 is required for @changesets/cli v3: it reads CHANGESETS_OUTPUT to
      # push tags and create GitHub releases after a publish.
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: release"
          pr-title: "chore: release"
          pr-base-branch: main
          create-github-releases: true
          push-git-tags: true
          # Use a PAT if the repo does not allow GitHub Actions to create PRs,
          # or if the release PR needs to trigger CI. GITHUB_TOKEN as an env
          # variable does not configure v2.
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
        env:
          # The first publish uses a granular token. Once the packages exist,
          # configure trusted publishing and leave NPM_TOKEN unset.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
