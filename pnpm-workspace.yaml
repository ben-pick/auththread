packages:
  - "packages/*/*"
  - "packages/sdk"
  - "apps/*"
  - "examples/*"

catalog:
  typescript: 6.0.3
  vitest: 5.0.5
  "@biomejs/biome": 2.6.4
  "@types/node": 24.19.2
  dependency-cruiser: 18.7.1
  turbo: 2.11.10

# esbuild ships a native binary through a postinstall. Allow that one build and
# nothing else, so an added dependency cannot run a script silently.
allowBuilds:
  esbuild: true
