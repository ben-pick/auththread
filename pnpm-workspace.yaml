packages:
  - "packages/*/*"
  - "packages/sdk"
  - "apps/*"
  - "examples/*"

catalog:
  typescript: 6.0.3
  vitest: 5.0.5
  effect: 4.1.2
  "@effect/vitest": 4.1.2
  "@effect/platform-node": 4.1.2
  "@biomejs/biome": 2.6.4
  "@cloudflare/workers-types": 5.20261123.1
  "@types/node": 24.19.2
  dependency-cruiser: 18.7.1
  turbo: 2.11.10
  wrangler: 4.168.0

# Build scripts are opt-in per package. esbuild ships a native binary and
# workerd (used by Wrangler) needs its platform runtime selected at install
# time. Allow only those two, so an added dependency cannot run a script
# silently.
allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - vite@8.4.0
