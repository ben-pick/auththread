services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8081:8080"

  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "4318:4318"

  stitcher:
    build:
      context: ../..
      dockerfile: examples/node-docker/Dockerfile
    environment:
      AUTHTHREAD_CONFIG: /etc/auththread/config.json
      OTLP_ENDPOINT: http://lgtm:4318/v1/traces
      OTEL_SERVICE_NAME: auththread
    volumes:
      - ./config/auththread.json:/etc/auththread/config.json:ro
    ports:
      - "8787:8787"
    depends_on:
      - lgtm

  web:
    image: nginx:alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
