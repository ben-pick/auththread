<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>auththread Auth0 dogfood</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1020;
        color: #e8ecff;
      }
      main {
        width: min(560px, calc(100vw - 48px));
        padding: 32px;
        border: 1px solid #293250;
        border-radius: 16px;
        background: #121936;
        box-shadow: 0 20px 60px rgb(0 0 0 / 35%);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      p {
        color: #aeb8d8;
        line-height: 1.5;
      }
      button {
        margin-top: 16px;
        padding: 12px 16px;
        border: 0;
        border-radius: 10px;
        background: #5b8cff;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      code {
        color: #b6f0c8;
        word-break: break-all;
      }
      #status {
        min-height: 1.5em;
      }
      #identity {
        color: #e8ecff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>auththread Auth0 dogfood</h1>
      <p>
        This page uses Auth0 Universal Login. It creates the auththread trace,
        carries it through <code>ext-trace_id</code>, and records the callback.
      </p>
      <p>Trace: <code id="trace">-</code></p>
      <p>Status: <span id="status">starting…</span></p>
      <p id="identity"></p>
      <button id="login" type="button" disabled>Log in with Auth0</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
